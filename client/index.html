<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicPulse — Autonomous Municipal Triage & Infrastructure Copilot</title>
    <!-- Tailwind CSS CDN with configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              pulse: {
                50: '#ecfdf5',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
              },
              municipal: {
                blue: '#0284c7',
                navy: '#0f172a',
                card: '#1e293b',
                border: '#334155'
              }
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite'
            }
          }
        }
      }
    </script>
    <!-- Leaflet GIS CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      code, pre, .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom map styling for dark mode */
      .dark-map .leaflet-tile {
        filter: brightness(0.7) invert(1) contrast(1.6) hue-rotate(200deg) saturate(0.4) brightness(0.85);
      }
      .satellite-map .leaflet-tile,
      .street-map .leaflet-tile {
        filter: none !important;
      }
      .leaflet-popup-content-wrapper {
        background-color: #0f172a !important;
        color: #f8fafc !important;
        border: 1px solid #334155 !important;
        border-radius: 0.75rem !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5) !important;
      }
      .leaflet-popup-tip {
        background-color: #0f172a !important;
      }
    </style>
  </head>
  <body class="h-full overflow-x-hidden selection:bg-emerald-500 selection:text-white">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
